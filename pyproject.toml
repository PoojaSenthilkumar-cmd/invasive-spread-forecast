[project]
name = "invasive-spread-forecast"
version = "0.1.0"
description = "Spatiotemporal forecasting of invasive species spread (Vespa velutina, Western Europe) from GBIF citizen-science sightings."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pygbif>=0.6.4",
    "pyinaturalist>=0.19",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "numpy>=1.26,<2.1",
    "pandas>=2.2",
    "pyarrow>=15",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.3.10",
    "rioxarray>=0.15",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "lightgbm>=4.7.0",
    "xgboost>=3.2.0",
    "optuna>=5.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["D100", "D104", "D203", "D213", "D401", "D413"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
